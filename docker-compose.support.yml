services:
  operix-support-web:
    build:
      context: .
      dockerfile: apps/OperiX Support/Dockerfile
    image: operix-support:local
    container_name: operix-support-web
    env_file:
      - .env.support
    environment:
      NODE_ENV: production
      PORT: "3010"
      HOSTNAME: 0.0.0.0
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3010/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  operix-support-worker:
    image: operix-support:local
    container_name: operix-support-worker
    depends_on:
      operix-support-web:
        condition: service_healthy
    env_file:
      - .env.support
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: "3011"
    ports:
      - "3011:3011"
    command: ["node_modules/.bin/tsx", "apps/OperiX Support/src/worker/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3011/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
