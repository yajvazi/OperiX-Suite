name: OperiX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "Optional app id to rerun; all changed apps when empty"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: operix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect affected applications
    runs-on: ubuntu-latest
    outputs:
      apps_json: ${{ steps.detect.outputs.apps_json }}
      web_apps_json: ${{ steps.detect.outputs.web_apps_json }}
      mobile_apps_json: ${{ steps.detect.outputs.mobile_apps_json }}
      backend_apps_json: ${{ steps.detect.outputs.backend_apps_json }}
      has_web: ${{ steps.detect.outputs.has_web }}
      has_mobile: ${{ steps.detect.outputs.has_mobile }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_supabase: ${{ steps.detect.outputs.has_supabase }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed and affected apps
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          OPERIX_APP: ${{ inputs.app || '' }}
        run: |
          set -euo pipefail
          node scripts/cicd/affected-apps.mjs > "$RUNNER_TEMP/operix-affected.json"
          jq -c '.apps' "$RUNNER_TEMP/operix-affected.json" > "$RUNNER_TEMP/apps.json"
          {
            echo "apps_json=$(jq -c '.apps' "$RUNNER_TEMP/operix-affected.json")"
            echo "web_apps_json=$(jq -c '.webApps' "$RUNNER_TEMP/operix-affected.json")"
            echo "mobile_apps_json=$(jq -c '.mobileApps' "$RUNNER_TEMP/operix-affected.json")"
            echo "backend_apps_json=$(jq -c '.backendApps' "$RUNNER_TEMP/operix-affected.json")"
            echo "has_web=$(jq -r '.hasWeb' "$RUNNER_TEMP/operix-affected.json")"
            echo "has_mobile=$(jq -r '.hasMobile' "$RUNNER_TEMP/operix-affected.json")"
            echo "has_backend=$(jq -r '.hasBackend' "$RUNNER_TEMP/operix-affected.json")"
            echo "has_supabase=$(jq -r '.hasSupabase' "$RUNNER_TEMP/operix-affected.json")"
          } >> "$GITHUB_OUTPUT"
          jq -r '.changedFiles[]?' "$RUNNER_TEMP/operix-affected.json" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "Affected applications: $(jq -r '.appIds | join(", ")' "$RUNNER_TEMP/operix-affected.json")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload affected-app manifest
        uses: actions/upload-artifact@v4
        with:
          name: operix-affected-apps
          path: ${{ runner.temp }}/operix-affected.json
          retention-days: 14

  security:
    name: Security and policy gates
    needs: changes
    uses: ./.github/workflows/operix-security.yml
    with:
      apps_json: ${{ needs.changes.outputs.apps_json }}

  web:
    name: Web build matrix
    needs: changes
    if: needs.changes.outputs.has_web == 'true'
    uses: ./.github/workflows/operix-web-build.yml
    with:
      apps_json: ${{ needs.changes.outputs.web_apps_json }}

  mobile:
    name: Mobile build matrix
    needs: changes
    if: needs.changes.outputs.has_mobile == 'true'
    uses: ./.github/workflows/operix-mobile-build.yml
    with:
      apps_json: ${{ needs.changes.outputs.mobile_apps_json }}

  backend:
    name: Backend and database gates
    needs: changes
    if: needs.changes.outputs.has_backend == 'true'
    uses: ./.github/workflows/operix-backend-test.yml
    with:
      apps_json: ${{ needs.changes.outputs.backend_apps_json }}
      run_local_supabase: ${{ needs.changes.outputs.has_supabase == 'true' }}

  required:
    name: OperiX required CI
    needs: [changes, security, web, mobile, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce applicable gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          HAS_WEB: ${{ needs.changes.outputs.has_web }}
          HAS_MOBILE: ${{ needs.changes.outputs.has_mobile }}
          HAS_BACKEND: ${{ needs.changes.outputs.has_backend }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || { echo "CI_PENDING/CI_FAILED: affected-app detection failed"; exit 1; }
          [[ "$SECURITY_RESULT" == success ]] || { echo "CI_FAILED: security gate result=$SECURITY_RESULT"; exit 1; }
          if [[ "$HAS_WEB" == true && "$WEB_RESULT" != success ]]; then echo "BUILD_FAILED: web result=$WEB_RESULT"; exit 1; fi
          if [[ "$HAS_MOBILE" == true && "$MOBILE_RESULT" != success ]]; then echo "CI_FAILED: mobile result=$MOBILE_RESULT"; exit 1; fi
          if [[ "$HAS_BACKEND" == true && "$BACKEND_RESULT" != success ]]; then echo "CI_FAILED: backend result=$BACKEND_RESULT"; exit 1; fi
          echo "CI_PASSED" >> "$GITHUB_STEP_SUMMARY"
