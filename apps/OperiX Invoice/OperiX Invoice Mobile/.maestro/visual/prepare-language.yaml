appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: auth-email-input
    timeout: 30000
- tapOn:
    id: auth-email-input
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: auth-sign-in-button
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- tapOn:
    id: nav-more-tab
- tapOn:
    id: more-settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- tapOn:
    id: settings-language-${VISUAL_LANGUAGE}-button
- waitForAnimationToEnd
- tapOn:
    id: settings-logout-button
- tapOn:
    text: ${VISUAL_SIGN_OUT}
- extendedWaitUntil:
    visible:
      id: auth-email-input
    timeout: 30000
- assertScreenshot:
    path: "baselines/${VISUAL_DEVICE}/${VISUAL_LANGUAGE}/login.png"
    thresholdPercentage: 98
- tapOn:
    id: auth-email-input
- inputText: ${E2E_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: auth-sign-in-button
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- assertScreenshot:
    path: "baselines/${VISUAL_DEVICE}/${VISUAL_LANGUAGE}/dashboard.png"
    thresholdPercentage: 98
