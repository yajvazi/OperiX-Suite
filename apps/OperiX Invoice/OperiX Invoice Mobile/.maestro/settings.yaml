appId: ${MAESTRO_APP_ID}
---
- runFlow: login.yaml
- tapOn:
    id: nav-more-tab
- tapOn:
    id: more-settings-button
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- tapOn:
    id: settings-section-appearance
- tapOn:
    id: settings-section-company
- tapOn:
    id: settings-section-visuals
- tapOn:
    id: settings-section-payments
- tapOn:
    id: settings-section-team
- tapOn:
    id: settings-section-security
- tapOn:
    id: settings-logout-button
- tapOn:
    text: Sign Out
- extendedWaitUntil:
    visible:
      id: auth-email-input
    timeout: 30000
