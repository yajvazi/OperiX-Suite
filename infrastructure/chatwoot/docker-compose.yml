name: operix-chatwoot

x-chatwoot-base: &chatwoot-base
  image: ${CHATWOOT_IMAGE:?Set CHATWOOT_IMAGE in .env}
  env_file:
    - .env
  volumes:
    - chatwoot-storage:/app/storage
  restart: unless-stopped
  networks:
    - chatwoot

services:
  rails:
    <<: *chatwoot-base
    container_name: operix-chatwoot-rails
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHATWOOT_PORT:-3040}:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ruby -rnet/http -e
          'response = Net::HTTP.get_response(URI("http://127.0.0.1:3000/api"));
          exit(response.code.to_i == 200 ? 0 : 1)'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  sidekiq:
    <<: *chatwoot-base
    container_name: operix-chatwoot-sidekiq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: operix-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - chatwoot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatwoot

  redis:
    image: redis:7.4.6-alpine
    container_name: operix-chatwoot-redis
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - chatwoot-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatwoot

volumes:
  chatwoot-storage:
    name: operix-chatwoot-storage
  chatwoot-postgres:
    name: operix-chatwoot-postgres
  chatwoot-redis:
    name: operix-chatwoot-redis

networks:
  chatwoot:
    name: operix-chatwoot
