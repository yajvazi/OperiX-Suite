name: operix-crm

services:
  server:
    image: twentycrm/twenty:${TWENTY_TAG:?Set TWENTY_TAG to a pinned Twenty release}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPERIX_CRM_BIND_PORT:-3020}:3000"
    volumes:
      - operix-crm-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      NODE_ENV: production
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:?Set PG_DATABASE_USER}:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-twenty}
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &crm-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - operix-crm-internal
      - operix-crm-edge

  worker:
    image: twentycrm/twenty:${TWENTY_TAG:?Set TWENTY_TAG to a pinned Twenty release}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    volumes:
      - operix-crm-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_ENV: production
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:?Set PG_DATABASE_USER}:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-twenty}
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-false}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *crm-logs
    networks:
      - operix-crm-internal

  db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:?Set PG_DATABASE_USER}
    volumes:
      - operix-crm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-postgres} -h 127.0.0.1 -d ${PG_DATABASE_NAME:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *crm-logs
    networks:
      - operix-crm-internal

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - operix-crm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *crm-logs
    networks:
      - operix-crm-internal

volumes:
  operix-crm-db-data:
    name: operix-crm-db-data
  operix-crm-server-local-data:
    name: operix-crm-server-local-data
  operix-crm-redis-data:
    name: operix-crm-redis-data

networks:
  operix-crm-internal:
    name: operix-crm-internal
    internal: true
  operix-crm-edge:
    name: operix-crm-edge
