services:
  operix-suite:
    build:
      context: .
      dockerfile: apps/OperiX Suite/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://operixsuite.com
    image: operix-suite-marketing:latest
    restart: unless-stopped
    env_file:
      - path: ./apps/OperiX Suite/.env.preview.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3013:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
